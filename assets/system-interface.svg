<svg width="1280" height="470" viewBox="0 0 1280 470" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Davi Silva — software development, backend and systems</title>
  <desc id="desc">Animated profile interface showing Davi Silva's current stack and software interests.</desc>

  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1210" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#090C11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#2F81F7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#21262D" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .ui { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .micro { fill:#7D8590; font-size:12px; font-weight:700; letter-spacing:1.4px; }
      .small { fill:#8B949E; font-size:14px; font-weight:600; }
      .title { fill:#F0F6FC; font-size:64px; font-weight:760; letter-spacing:-1.8px; }
      .sub { fill:#C9D1D9; font-size:18px; font-weight:600; }
      .label { fill:#7D8590; font-size:11px; font-weight:700; letter-spacing:1px; }
      .value { fill:#E6EDF3; font-size:14px; font-weight:650; }
      .route { stroke-dasharray:5 12; animation:route 14s linear infinite; }
      @keyframes route { to { stroke-dashoffset:-180; } }
    </style>
  </defs>

  <rect width="1280" height="470" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="470" rx="24" fill="url(#grid)" opacity="0.16"/>
  <rect x="1" y="1" width="1278" height="468" rx="23" stroke="#30363D" stroke-width="2"/>

  <!-- top bar -->
  <rect x="24" y="24" width="1232" height="48" rx="12" fill="#0B0F14" stroke="#21262D"/>
  <circle cx="48" cy="48" r="4" fill="#3FB950"/>
  <text x="62" y="52" class="mono micro">daviSilva-devv / profile</text>
  <text x="1228" y="52" text-anchor="end" class="mono micro">SÃO PAULO · BR</text>

  <!-- identity -->
  <text x="64" y="126" class="mono micro">SOFTWARE DEVELOPMENT · BACKEND · SYSTEMS</text>
  <text x="60" y="202" class="ui title">Davi Silva</text>
  <rect x="62" y="220" width="408" height="2" rx="1" fill="url(#accent)"/>
  <text x="64" y="258" class="ui sub">Java · Python · SQL · REST APIs</text>
  <text x="64" y="288" class="mono small">ADS @ SENAC · studying Mainframe / COBOL</text>

  <!-- stack row -->
  <g transform="translate(64 326)">
    <rect width="220" height="36" rx="8" fill="#0D1710" stroke="#238636"/>
    <circle cx="18" cy="18" r="4" fill="#3FB950"/>
    <text x="34" y="22" class="mono" fill="#7EE787" font-size="11" font-weight="800" letter-spacing="1">OPEN TO INTERNSHIP</text>

    <rect x="234" width="98" height="36" rx="8" fill="#0D1117" stroke="#30363D"/>
    <text x="283" y="22" text-anchor="middle" class="mono" fill="#C9D1D9" font-size="11" font-weight="700">JAVA</text>

    <rect x="344" width="98" height="36" rx="8" fill="#0D1117" stroke="#30363D"/>
    <text x="393" y="22" text-anchor="middle" class="mono" fill="#C9D1D9" font-size="11" font-weight="700">PYTHON</text>

    <rect x="454" width="72" height="36" rx="8" fill="#0D1117" stroke="#30363D"/>
    <text x="490" y="22" text-anchor="middle" class="mono" fill="#C9D1D9" font-size="11" font-weight="700">SQL</text>
  </g>

  <!-- current work -->
  <text x="64" y="414" class="mono label">working on</text>
  <text x="148" y="414" class="mono value">backend fundamentals, automation and business workflows</text>

  <!-- project flow -->
  <g transform="translate(708 96)">
    <rect width="500" height="318" rx="18" fill="#0B0F14" stroke="#30363D"/>

    <text x="24" y="34" class="mono micro">PROJECT FLOW</text>
    <line x1="24" y1="52" x2="476" y2="52" stroke="#21262D"/>

    <!-- left nodes -->
    <g transform="translate(24 92)">
      <rect width="130" height="58" rx="10" fill="#0D1117" stroke="#30363D"/>
      <text x="14" y="24" class="ui value">Business rules</text>
      <text x="14" y="43" class="mono label">logic &amp; workflow</text>
    </g>

    <g transform="translate(24 184)">
      <rect width="130" height="58" rx="10" fill="#0D1117" stroke="#30363D"/>
      <text x="14" y="24" class="ui value">Data / SQL</text>
      <text x="14" y="43" class="mono label">queries &amp; validation</text>
    </g>

    <!-- center -->
    <g transform="translate(184 138)">
      <rect width="136" height="58" rx="10" fill="#0C1520" stroke="#1F6FEB"/>
      <text x="68" y="24" text-anchor="middle" class="ui value">Backend / APIs</text>
      <text x="68" y="43" text-anchor="middle" class="mono label">REST &amp; application logic</text>
    </g>

    <!-- right nodes -->
    <g transform="translate(350 92)">
      <rect width="126" height="58" rx="10" fill="#0D1117" stroke="#30363D"/>
      <text x="63" y="24" text-anchor="middle" class="ui value">Applications</text>
      <text x="63" y="43" text-anchor="middle" class="mono label">systems</text>
    </g>

    <g transform="translate(350 184)">
      <rect width="126" height="58" rx="10" fill="#0D1117" stroke="#30363D"/>
      <text x="63" y="24" text-anchor="middle" class="ui value">COBOL</text>
      <text x="63" y="43" text-anchor="middle" class="mono label">current study</text>
    </g>

    <!-- connectors -->
    <path d="M154 121H184M154 213H184M320 167H350M320 167V213H350" stroke="#2F81F7" stroke-width="1.4" opacity="0.55"/>
    <path d="M154 121H184M154 213H184M320 167H350M320 167V213H350" stroke="#58A6FF" stroke-width="1.4" class="route" opacity="0.75"/>

    <!-- subtle data packets -->
    <circle r="3.5" fill="#58A6FF">
      <animateMotion dur="7s" repeatCount="indefinite" path="M154 121 H184" />
    </circle>
    <circle r="3.5" fill="#58A6FF">
      <animateMotion dur="8.5s" begin="1.5s" repeatCount="indefinite" path="M320 167 H350" />
    </circle>

    <line x1="24" y1="270" x2="476" y2="270" stroke="#21262D"/>
    <text x="24" y="297" class="mono label">understand → build → validate → improve</text>
  </g>
</svg>
