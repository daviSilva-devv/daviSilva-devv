<svg width="1280" height="540" viewBox="0 0 1280 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Davi Silva — software development, backend and systems</title>
  <desc id="desc">Animated systems interface for Davi Silva's GitHub profile.</desc>

  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1210" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A0F"/>
      <stop offset="0.52" stop-color="#09111B"/>
      <stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="panel" x1="800" y1="80" x2="1190" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1623"/>
      <stop offset="1" stop-color="#090E16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(275 205) rotate(35) scale(430 280)">
      <stop stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#17304A" stroke-width="1"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="22" y="22" width="1236" height="496" rx="24"/>
    </clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .ui { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .micro { fill:#64748B; font-size:12px; font-weight:700; letter-spacing:2px; }
      .small { fill:#94A3B8; font-size:14px; font-weight:600; }
      .body { fill:#CBD5E1; font-size:16px; font-weight:600; }
      .title { fill:#F8FAFC; font-size:74px; font-weight:800; letter-spacing:-2px; }
      .sub { fill:#CBD5E1; font-size:20px; font-weight:600; letter-spacing:1px; }
      .nodeTitle { fill:#E2E8F0; font-size:14px; font-weight:700; }
      .nodeSub { fill:#64748B; font-size:11px; font-weight:700; letter-spacing:1px; }
      .dash { stroke-dasharray:14 10; animation: flow 9s linear infinite; }
      .dashFast { stroke-dasharray:8 10; animation: flowFast 4s linear infinite; }
      .pulse { animation:pulse 2.1s ease-in-out infinite; }
      .blink { animation:blink 1.15s steps(2,end) infinite; }
      .float { animation:float 8s ease-in-out infinite; }
      .scan { animation:scan 5.5s linear infinite; }
      .event1 { animation:event1 9s linear infinite; }
      .event2 { animation:event2 9s linear infinite; }
      .event3 { animation:event3 9s linear infinite; }
      @keyframes flow { to { stroke-dashoffset:-240; } }
      @keyframes flowFast { to { stroke-dashoffset:-180; } }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      @keyframes blink { 0%,48%{opacity:1} 49%,100%{opacity:.18} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
      @keyframes scan { 0%{transform:translateY(-40px);opacity:0} 8%{opacity:.55} 90%{opacity:.35} 100%{transform:translateY(580px);opacity:0} }
      @keyframes event1 { 0%,28%{opacity:1} 33%,100%{opacity:0} }
      @keyframes event2 { 0%,31%{opacity:0} 34%,61%{opacity:1} 66%,100%{opacity:0} }
      @keyframes event3 { 0%,64%{opacity:0} 67%,94%{opacity:1} 100%{opacity:0} }
    </style>
  </defs>

  <rect width="1280" height="540" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#screenClip)">
    <rect width="1280" height="540" fill="url(#grid)" opacity="0.26"/>
    <ellipse cx="240" cy="180" rx="430" ry="280" fill="url(#glow)" filter="url(#blur)" class="float"/>
    <rect x="0" y="-28" width="1280" height="28" fill="url(#accent)" opacity="0.09" class="scan"/>
  </g>

  <rect x="22" y="22" width="1236" height="496" rx="24" stroke="#1E293B" stroke-width="2"/>
  <rect x="36" y="36" width="1208" height="468" rx="18" stroke="#0F2638" stroke-width="1"/>

  <!-- top rail -->
  <circle cx="68" cy="66" r="4" fill="#22C55E" class="pulse"/>
  <text x="82" y="71" class="mono micro" fill="#86EFAC">PROFILE / LIVE</text>
  <text x="1118" y="71" class="mono micro" text-anchor="end">SAO PAULO</text>
  <text x="1210" y="71" class="mono micro" text-anchor="end">BR</text>
  <line x1="58" y1="88" x2="1222" y2="88" stroke="#162236"/>

  <!-- identity -->
  <text x="72" y="150" class="mono micro">SOFTWARE DEVELOPMENT · BACKEND · SYSTEMS</text>
  <text x="68" y="232" class="ui title">Davi Silva</text>
  <rect x="70" y="253" width="570" height="3" rx="1.5" fill="url(#accent)" filter="url(#softGlow)"/>
  <text x="72" y="294" class="ui sub">Java · Python · SQL · REST APIs</text>
  <text x="72" y="326" class="mono small">ADS @ SENAC  /  exploring Mainframe + COBOL</text>

  <!-- status strip -->
  <g transform="translate(72 362)">
    <rect width="210" height="38" rx="19" fill="#08120D" stroke="#184D2A"/>
    <circle cx="22" cy="19" r="5" fill="#22C55E" class="pulse"/>
    <text x="39" y="24" class="mono" fill="#86EFAC" font-size="12" font-weight="800" letter-spacing="1.2">OPEN TO INTERNSHIP</text>

    <rect x="226" width="142" height="38" rx="19" fill="#0B1320" stroke="#1D3552"/>
    <text x="297" y="24" text-anchor="middle" class="mono" fill="#93C5FD" font-size="12" font-weight="800">JAVA</text>

    <rect x="380" width="142" height="38" rx="19" fill="#0B1320" stroke="#1D3552"/>
    <text x="451" y="24" text-anchor="middle" class="mono" fill="#93C5FD" font-size="12" font-weight="800">PYTHON</text>

    <rect x="534" width="106" height="38" rx="19" fill="#0B1320" stroke="#1D3552"/>
    <text x="587" y="24" text-anchor="middle" class="mono" fill="#93C5FD" font-size="12" font-weight="800">SQL</text>
  </g>

  <!-- rotating event line -->
  <g transform="translate(72 444)">
    <text x="0" y="0" class="mono micro">CURRENT SIGNAL</text>
    <circle cx="145" cy="-4" r="3" fill="#38BDF8" class="blink"/>
    <text x="162" y="0" class="mono body event1">building software around real operational problems</text>
    <text x="162" y="0" class="mono body event2">turning business rules into maintainable systems</text>
    <text x="162" y="0" class="mono body event3">learning enterprise computing through Mainframe / COBOL</text>
  </g>

  <!-- right systems map -->
  <g transform="translate(760 112)">
    <rect width="430" height="330" rx="22" fill="url(#panel)" stroke="#1E293B"/>
    <text x="26" y="40" class="mono micro">SYSTEM MAP / WORKING SET</text>
    <circle cx="386" cy="34" r="5" fill="#38BDF8" class="pulse"/>

    <!-- connectors -->
    <path d="M95 106H212V160H330" stroke="#244A69" stroke-width="2" class="dash" fill="none"/>
    <path d="M95 232H212V178H330" stroke="#244A69" stroke-width="2" class="dashFast" fill="none"/>

    <!-- node 1 -->
    <g transform="translate(26 78)">
      <rect width="138" height="58" rx="13" fill="#0A1420" stroke="#1D3552"/>
      <text x="16" y="25" class="ui nodeTitle">Business rules</text>
      <text x="16" y="43" class="mono nodeSub">REAL WORKFLOWS</text>
    </g>

    <!-- node 2 -->
    <g transform="translate(26 204)">
      <rect width="138" height="58" rx="13" fill="#0A1420" stroke="#1D3552"/>
      <text x="16" y="25" class="ui nodeTitle">Data / SQL</text>
      <text x="16" y="43" class="mono nodeSub">VALIDATION</text>
    </g>

    <!-- core -->
    <g transform="translate(165 142)">
      <circle cx="47" cy="28" r="45" fill="#091827" stroke="#2563EB" stroke-width="2"/>
      <circle cx="47" cy="28" r="35" fill="none" stroke="#38BDF8" stroke-opacity="0.28" class="pulse"/>
      <text x="47" y="24" text-anchor="middle" class="mono" fill="#E2E8F0" font-size="11" font-weight="800">BACKEND</text>
      <text x="47" y="40" text-anchor="middle" class="mono" fill="#7DD3FC" font-size="10" font-weight="700">APIs</text>
      <circle cx="47" cy="-17" r="4" fill="#38BDF8">
        <animateTransform attributeName="transform" type="rotate" from="0 47 28" to="360 47 28" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- outputs -->
    <g transform="translate(300 128)">
      <rect width="104" height="58" rx="13" fill="#0A1420" stroke="#1D3552"/>
      <text x="52" y="24" text-anchor="middle" class="ui nodeTitle">Systems</text>
      <text x="52" y="43" text-anchor="middle" class="mono nodeSub">BUILD</text>
    </g>

    <g transform="translate(300 204)">
      <rect width="104" height="58" rx="13" fill="#10131A" stroke="#334155"/>
      <text x="52" y="24" text-anchor="middle" class="ui nodeTitle">COBOL</text>
      <text x="52" y="43" text-anchor="middle" class="mono nodeSub">LEARNING</text>
    </g>

    <line x1="26" y1="286" x2="404" y2="286" stroke="#172033"/>
    <text x="26" y="312" class="mono" fill="#64748B" font-size="11">flow: understand → build → validate → improve</text>
  </g>

  <!-- bottom waveform -->
  <path d="M58 488H176L190 478L204 497L218 470L233 488H360L374 482L388 494L402 477L416 488H544L557 472L570 501L584 481L598 488H716" stroke="#173C58" stroke-width="2" fill="none"/>
  <path d="M58 488H176L190 478L204 497L218 470L233 488H360L374 482L388 494L402 477L416 488H544L557 472L570 501L584 481L598 488H716" stroke="#38BDF8" stroke-width="2" fill="none" stroke-dasharray="48 640" class="dashFast" filter="url(#softGlow)"/>
</svg>
