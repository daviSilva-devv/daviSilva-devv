name: Profile Metrics

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate profile dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: daviSilva-devv
          filename: github-metrics.svg

          # Real GitHub data first. No decorative fake cards.
          base: header, activity, community
          base_indepth: yes
          base_hireable: yes

          # Full-year isometric contribution calendar.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages become more representative as portfolio repos are published.
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          plugin_languages_ignored: html, css

          # Show actual recent work, including pushes.
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 0
          plugin_activity_filter: push, pr, issue, review, release, ref/create

          # Coding patterns based on real activity.
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Dashboard layout: 2 columns desktop / 1 column mobile.
          config_display: columns
          config_timezone: America/Sao_Paulo
